[package]
name = "ra"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust CLI for Deadline Cloud job attachment operations"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
rusty-attachments-common = { path = "../common" }
rusty-attachments-model = { path = "../model" }
rusty-attachments-filesystem = { path = "../filesystem" }
rusty-attachments-profiles = { path = "../profiles" }
rusty-attachments-storage = { path = "../storage" }
rusty-attachments-storage-crt = { path = "../storage-crt" }
ja-deadline-utils = { path = "../ja-deadline-utils" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
configparser = "3"
dirs = "6"
thiserror = "1.0"
indicatif = "0.17"
tempfile = "3.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
